<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Boxes -->
  <rect x="50" y="50" width="200" height="80" rx="5" ry="5" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="350" y="50" width="200" height="80" rx="5" ry="5" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="650" y="50" width="100" height="80" rx="5" ry="5" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  
  <rect x="200" y="200" width="400" height="100" rx="5" ry="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  
  <rect x="50" y="350" width="200" height="40" rx="5" ry="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="550" y="350" width="200" height="40" rx="5" ry="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Text -->
  <text x="150" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Buyer</text>
  <text x="450" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">TonStores Checkout</text>
  <text x="700" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Seller</text>
  
  <text x="400" y="240" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold">Paystack Payment Gateway</text>
  <text x="400" y="260" text-anchor="middle" font-family="Arial" font-size="12">(White-labeled)</text>
  
  <text x="150" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Buyer's Bank</text>
  <text x="650" y="370" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">Seller's Bank</text>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
  
  <!-- Payment Flow -->
  <line x1="150" y1="130" x2="400" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="170" text-anchor="middle" font-family="Arial" font-size="10">1. Payment</text>
  
  <line x1="450" y1="130" x2="450" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="170" text-anchor="middle" font-family="Arial" font-size="10">2. Process</text>
  
  <line x1="600" y1="250" x2="700" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="200" text-anchor="middle" font-family="Arial" font-size="10">3. Credit Subaccount</text>
  
  <line x1="150" y1="350" x2="200" y2="300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="320" text-anchor="middle" font-family="Arial" font-size="10">4. Debit</text>
  
  <line x1="600" y1="300" x2="650" y2="350" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="320" text-anchor="middle" font-family="Arial" font-size="10">5. Automated Payout</text>
  
  <!-- Legend -->
  <rect x="650" y="150" width="15" height="15" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="670" y="162" font-family="Arial" font-size="10">Payment Gateway</text>
  
  <rect x="650" y="170" width="15" height="15" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="670" y="182" font-family="Arial" font-size="10">User/Platform</text>
  
  <rect x="650" y="190" width="15" height="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="670" y="202" font-family="Arial" font-size="10">Banks</text>
</svg> 